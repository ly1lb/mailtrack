<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>MailTrack Pro – nustatymai</title>
<style>
  body { font: 14px/1.5 system-ui, Arial, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px; color: #1f2937; }
  h1 { font-size: 20px; } h1 .t { color: #16803c; }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  input[type=text], input[type=url], input[type=password] { width: 100%; padding: 9px 11px; border: 1px solid #d0d5dd; border-radius: 8px; box-sizing: border-box; }
  .chk { font-weight: 400; display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 8px; background: #2a78d6; color: #fff; font: inherit; cursor: pointer; }
  button.sec { background: #eef1f5; color: #1f2937; }
  .help { color: #6b7280; font-size: 12.5px; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.ok { background: #e6f4ea; color: #16803c; display: block; }
  .msg.err { background: #fde8e7; color: #b3261e; display: block; white-space: pre-wrap; }
  .card { border: 1px solid #e3e6eb; border-radius: 10px; padding: 16px; }
</style>
</head>
<body>
<h1><span class="t">✓✓</span> MailTrack Pro – nustatymai</h1>
<div class="card">
  <label>Serverio adresas</label>
  <input type="url" id="serverUrl" placeholder="https://track.jusudomenas.lt">
  <div class="help">Jūsų subdomenas Hostingeryje (be galinio /).</div>

  <label>API raktas</label>
  <input type="text" id="apiKey" placeholder="Iš skydelio → Įdiegimas">
  <div class="help">Rasite prisijungę prie skydelio: <b>Įdiegimas</b> arba <b>Nustatymai → API raktas</b>.</div>

  <label class="chk"><input type="checkbox" id="trackByDefault" checked> Sekti laiškus pagal nutylėjimą (jungiklį galima išjungti kiekvienam laiškui)</label>
  <label class="chk"><input type="checkbox" id="trackLinks" checked> Sekti nuorodų paspaudimus (perrašo nuorodas)</label>
  <label class="chk"><input type="checkbox" id="desktopNotify" checked> Rodyti darbalaukio pranešimus apie atidarymus</label>
  <label class="chk"><input type="checkbox" id="showTplButton" checked> Rodyti „Įkelti šabloną“ mygtuką Gmail rašymo lange <span class="help">(jei trukdo ar dengiasi su kitu plėtiniu – išjunkite; šablonus visada galite įterpti per plėtinio ikoną)</span></label>

  <button id="save">Išsaugoti ir patikrinti</button>
  <button id="test" class="sec">Tik patikrinti ryšį</button>
  <div class="msg" id="msg"></div>
</div>
<script src="options.js"></script>
</body>
</html>
